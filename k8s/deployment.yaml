apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
        - name: student-management
          image: YOUR_DOCKERHUB_USERNAME/student-management-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000